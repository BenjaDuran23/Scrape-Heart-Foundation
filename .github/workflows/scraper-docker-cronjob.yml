name: Recipe Scraper Cronjob (Docker)

on:
  schedule:
    # Ejecutar cada día a las 2:00 AM UTC
    - cron: '0 2 * * *'
  # Permitir ejecución manual
  workflow_dispatch:

# Permisos mínimos necesarios (principio de mínimo privilegio)
permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t recipe-scraper .

      - name: Run scraper in Docker
        run: docker run --rm -v ${{ github.workspace }}:/app recipe-scraper

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update recipe data $(date +'%Y-%m-%d %H:%M:%S')" && git push)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
